<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MumlyCare Certification Exam</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:40px;
    background-color:#F8E6F2;
    background-image:url("mumlycare-logo-text-Be61iYWR.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:525px;
    background-attachment:fixed;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(248,230,242,.85);
    z-index:-1;
}

.question{
    margin:20px 0;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    background:#fff;
}

button{
    padding:10px 25px;
    background:green;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:disabled{
    background:gray;
    cursor:not-allowed;
}

#timer{
    color:red;
    font-size:20px;
    font-weight:bold;
}

input{
    padding:8px;
    width:320px;
    max-width:100%;
}

#result{
    margin-top:20px;
    font-weight:bold;
    color:green;
}
</style>
</head>

<body>

<h2 style="text-align:center;color:maroon">
    MumlyCare Certification Exam
</h2>

<p id="timer">Time Left: 45:00</p>

<label><b>Candidate Name:</b></label><br>
<input type="text" id="name" placeholder="Enter your full name">
<br><br>

<label><b>Email Address:</b></label><br>
<input type="email" id="email" placeholder="Enter your email">
<br><br>

<label><b>Mobile Number:</b></label><br>
<input
    type="tel"
    id="mobile"
    placeholder="Enter your mobile number"
    maxlength="10"
    inputmode="numeric"
    oninput="this.value=this.value.replace(/[^0-9]/g,'')">
<br><br>

<div id="questions"></div>

<button id="submitBtn" onclick="submitExam()">
    Submit Exam
</button>

<p id="result"></p>

<script>

// ============================
// GOOGLE APPS SCRIPT URL
// ============================
const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbwt5D2f6_E7tlHPAwstF8hFh14eqRXSK68nGIWkX2muZmCtFJO_pUxt_2i_UR8sEoRHWQ/exec";

let questions = [];
let submitted = false;

// ============================
// LOAD QUESTIONS
// ============================
function loadQuestions() {

    fetch(WEB_APP_URL)
        .then(response => {
            if (!response.ok) {
                throw new Error("Unable to fetch questions.");
            }
            return response.text();
        })
        .then(text => {

            questions = JSON.parse(text);

            if (!Array.isArray(questions) || questions.length === 0) {
                throw new Error("No questions found.");
            }

            // Shuffle Questions
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] =
                [questions[j], questions[i]];
            }

            renderQuestions();
        })
        .catch(error => {
            console.error(error);
            alert("Failed to load questions.");
        });
}

// ============================
// DISPLAY QUESTIONS
// ============================

    const box = document.getElementById("questions");
    box.innerHTML = "";

    questions.forEach((q, i) => {

        let html = `
            <div class="question">
                <b>${i + 1}. ${q.q}</b>
