<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MumlyCare Certification Exam</title>

<style>
body{
    font-family:Arial;
    margin:40px;
    background-color:#F8E6F2;
    background-image:url("mumlycare-logo-text-Be61iYWR.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:525px;
    background-attachment:fixed;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(248,230,242,.85);
    z-index:-1;
}

#headerBar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
    background:#fff;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:20px;
    position:sticky;
    top:0;
    z-index:1000;
}

#currentDate,
#timer{
    color:maroon;
    font-size:18px;
    font-weight:bold;
}

.question{
    margin:20px 0;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    background:#fff;
}

button{
    padding:10px 25px;
    background:green;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0b6b0b;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}

input{
    padding:8px;
    width:320px;
    max-width:100%;
}

#loading{
    display:none;
    text-align:center;
    font-weight:bold;
    color:maroon;
    margin:20px 0;
}

#examFooter{
    text-align:center;
    margin-top:30px;
}

#result{
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2 style="text-align:center;color:maroon">
    MumlyCare Certification Exam
</h2>

<div id="headerBar">
    <div id="currentDate"></div>
    <div id="timer">Time Left: 45:00</div>
</div>

<label><b>Candidate Name:</b></label><br>
<input type="text" id="name" placeholder="Enter your full name"><br><br>

<label><b>Email Address:</b></label><br>
<input type="email" id="email" placeholder="Enter your email"><br><br>

<label><b>Mobile Number:</b></label><br>
<input
    type="tel"
    id="mobile"
    placeholder="Enter your mobile number"
    maxlength="10"
    inputmode="numeric"
    oninput="this.value=this.value.replace(/[^0-9]/g,'')">
<br><br>

<div id="loading">
    Loading exam questions, please wait...
</div>

<div id="questions"></div>

<div id="examFooter">

    <button id="startBtn" onclick="startExam()">
        Start Exam
    </button>

    <button id="submitBtn"
            onclick="submitExam()"
            style="display:none;">
        Submit Exam
    </button>

</div>

<p id="result"></p>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzUeXJmK5p-5GIwCAngnyyUQUW4xWe5UU1LzhrNd1zwEqgwtbFVWjwLxucLeH8lHEGf7w/exec";

let questions = [];
let time = 2700;
let timer;

/* DATE */

function updateDateTime() {

    const now = new Date();

    document.getElementById("currentDate").innerHTML =
        now.toLocaleDateString("en-GB") +
        " " +
        now.toLocaleTimeString("en-GB");
}

updateDateTime();
setInterval(updateDateTime,1000);

/* START EXAM */

function startExam() {

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const mobile =
        document.getElementById("mobile").value.trim();

    if(name === ""){
        alert("Please enter your Name.");
        return;
    }

    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!emailPattern.test(email)){
        alert("Please enter a valid Email Address.");
        return;
    }

    if(!/^[0-9]{10}$/.test(mobile)){
        alert("Please enter a valid 10-digit Mobile Number.");
        return;
    }

    document.getElementById("startBtn").disabled = true;

    document.getElementById("loading").style.display =
        "block";

    loadQuestions();
}

/* LOAD QUESTIONS */

function loadQuestions(){

    fetch(WEB_APP_URL)

    .then(r => r.text())

    .then(t => {

        questions = JSON.parse(t);

        renderQuestions();

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("submitBtn").style.display =
            "inline-block";

        startTimer();
    })

    .catch(() => {

        document.getElementById("loading").innerHTML =
            "Failed to load questions.";

        document.getElementById("startBtn").disabled =
            false;
    });
}

/* RENDER QUESTIONS */

function renderQuestions(){

    const box =
        document.getElementById("questions");

    box.innerHTML = "";

    questions.forEach((q,i)=>{

        let h =
        `<div class="question">
            <b>${i+1}. ${q.q}</b><br><br>`;

        q.o.forEach((o,j)=>{

            h += `
            <label>
              <input
                 type="radio"
                 name="q${i}"
                 value="${j}">
              ${o}
            </label><br>`;
        });

        h += "</div>";

        box.innerHTML += h;
    });
}

/* TIMER */

function startTimer(){

    timer = setInterval(()=>{

        if(time <= 0){

            clearInterval(timer);

            alert(
              "Time is up. Exam will be submitted automatically."
            );

            submitExam();

            return;
        }

        if(time === 300){
            alert("Only 5 minutes remaining!");
        }

        time--;

        document.getElementById("timer").innerText =
        `Time Left: ${
            String(Math.floor(time/60))
            .padStart(2,"0")
        }:${
            String(time%60)
            .padStart(2,"0")
        }`;

    },1000);
}

/* SUBMIT */

function submitExam(){

    clearInterval(timer);

    document.getElementById("submitBtn")
        .disabled = true;

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const mobile =
        document.getElementById("mobile").value.trim();

    let score = 0;

    for(let i=0;i<questions.length;i++){

        const a =
        document.querySelector(
        `input[name="q${i}"]:checked`);

        if(a &&
           parseInt(a.value) === questions[i].a){
            score++;
        }
    }

    const percent =
        Math.round(
        score/questions.length*100
        );

    const status =
        percent >= 70 ? "PASS" : "FAIL";

    const url =
        WEB_APP_URL +
        "?name=" +
        encodeURIComponent(name) +
        "&email=" +
        encodeURIComponent(email) +
        "&mobile=" +
        encodeURIComponent(mobile) +
        "&score=" +
        percent +
        "&status=" +
        status;

    document.getElementById("result")
        .innerHTML = "Submitting...";

    fetch(url)

    .then(()=>{

        document.getElementById("result")
        .innerHTML =
        "✅ Thank you for completing the MumlyCare Certification Assessment.<br><br>" +
        "MumlyCare Admin team will contact you.";

    })

    .catch(()=>{
        alert("Error saving result");
    });
}

</script>

</body>
</html>
