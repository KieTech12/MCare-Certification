<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MumlyCare Certification Exam</title>

<style>
body{
    font-family:Arial;
    margin:40px;
    background-color:#F8E6F2;
    background-image:url("mumlycare-logo-text-Be61iYWR.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:525px;
    background-attachment:fixed;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(248,230,242,.85);
    z-index:-1;
}

#headerBar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
    background:#ffffff;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:20px;
    position:sticky;
    top:0;
    z-index:1000;
}

#currentDate,
#timer{
    color:maroon;
    font-size:18px;
    font-weight:bold;
}

.question{
    margin:20px 0;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    background:#fff;
}

button{
    padding:10px 25px;
    background:green;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0b6b0b;
}

input{
    padding:8px;
    width:320px;
    max-width:100%;
}

#result{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2 style="text-align:center;color:maroon">
    MumlyCare Certification Exam
</h2>

<div id="headerBar">
    <div id="currentDate"></div>
    <div id="timer">Time Left: 45:00</div>
</div>

<label><b>Candidate Name:</b></label><br>
<input type="text" id="name" placeholder="Enter your full name"><br><br>

<label><b>Email Address:</b></label><br>
<input type="email" id="email" placeholder="Enter your email" required><br><br>

<label><b>Mobile Number:</b></label><br>
<input
    type="tel"
    id="mobile"
    placeholder="Enter your mobile number"
    maxlength="10"
    inputmode="numeric"
    oninput="this.value=this.value.replace(/[^0-9]/g,'')">
<br><br>

<div id="questions"></div>

<button onclick="submitExam()">Submit Exam</button>

<p id="result"></p>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzUeXJmK5p-5GIwCAngnyyUQUW4xWe5UU1LzhrNd1zwEqgwtbFVWjwLxucLeH8lHEGf7w/exec";

let questions = [];

/* DATE & TIME DISPLAY */
function updateDateTime() {
    const now = new Date();

    document.getElementById("currentDate").innerHTML =
        now.toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }) +
        " " +
        now.toLocaleTimeString("en-GB");
}

updateDateTime();
setInterval(updateDateTime, 1000);

/* LOAD QUESTIONS */
function loadQuestions() {
    fetch(WEB_APP_URL)
    .then(r => r.text())
    .then(t => {

        questions = JSON.parse(t);

        for(let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] =
            [questions[j], questions[i]];
        }

        renderQuestions();

    })
    .catch(() => alert("Failed to load questions"));
}

/* RENDER QUESTIONS */
function renderQuestions() {

    const box = document.getElementById("questions");
    box.innerHTML = "";

    questions.forEach((q, i) => {

        let h =
        `<div class="question">
            <b>${i + 1}. ${q.q}</b><br><br>`;

        q.o.forEach((o, j) => {
            h +=
            `<label>
                <input type="radio" name="q${i}" value="${j}">
                ${o}
             </label><br>`;
        });

        h += "</div>";

        box.innerHTML += h;
    });
}

/* 45-MINUTE TIMER */
let time = 2700;

let timer = setInterval(() => {

    if (time <= 0) {

        clearInterval(timer);

        alert("Time is up. Your exam will be submitted automatically.");

        submitExam();
        return;
    }

    if (time === 300) {
        alert("Only 5 minutes remaining!");
    }

    time--;

    document.getElementById("timer").innerText =
        `Time Left: ${String(Math.floor(time / 60)).padStart(2,"0")}:${String(time % 60).padStart(2,"0")}`;

}, 1000);
