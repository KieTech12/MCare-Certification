<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MumlyCare Certification Exam</title>

<style>
body{
    font-family:Arial;
    margin:40px;
    background-color:#F8E6F2;
    background-image:url("mumlycare-logo-text-Be61iYWR.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:525px;
    background-attachment:fixed;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(248,230,242,.85);
    z-index:-1;
}

#headerBar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
    background:#fff;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:20px;
    position:sticky;
    top:0;
    z-index:1000;
}

#currentDate,
#timer{
    color:maroon;
    font-size:18px;
    font-weight:bold;
}

.question{
    margin:20px 0;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    background:#fff;
}

button{
    padding:10px 25px;
    background:green;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0b6b0b;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}

input{
    padding:8px;
    width:320px;
    max-width:100%;
}

#loading{
    display:none;
    text-align:center;
    font-weight:bold;
    color:maroon;
    margin:20px 0;
}

#examFooter{
    text-align:center;
    margin-top:30px;
}

#result{
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2 style="text-align:center;color:maroon;font-size:2.16em;font-weight:bold;">MumlyCare Certification Exam</h2>

<div id="headerBar">
    <div id="currentDate"></div>
    <div id="timer">Time Left: 45:00</div>
</div>

<label><b>Candidate Name:</b></label><br>
<input type="text" id="name" placeholder="Enter your full name"><br><br>

<label><b>Email Address:</b></label><br>
<input type="email" id="email" placeholder="Enter your email"><br><br>

<label><b>Mobile Number:</b></label><br>
<input
    type="tel"
    id="mobile"
    placeholder="Enter your mobile number"
    maxlength="10"
    inputmode="numeric"
    oninput="this.value=this.value.replace(/[^0-9]/g,'')">
<br><br>

<div id="loading">
    Loading exam questions, please wait...
</div>

<div id="questions"></div>

<div id="examFooter">

    <button id="startBtn" onclick="startExam()">
        Start Exam
    </button>

    <button id="submitBtn"
            onclick="submitExam()"
            style="display:none;">
        Submit Exam
    </button>

</div>

<p id="result"></p>

<script
